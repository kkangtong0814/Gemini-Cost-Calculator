<div id="gemini_cost_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Gemini 비용 계산기 (v2.1.1)</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <!-- 지출 통계 요약 박스 -->
            <div class="gcost-stats-box">
                <div class="gcost-stats-grid">
                    <div class="gcost-stat-item">
                        <span class="gcost-stat-label">오늘 지출 (전체)</span>
                        <strong id="gcost_stat_today" class="gcost-stat-value">0원</strong>
                        <small id="gcost_stat_today_sub" class="gcost-stat-sub">메인 0원 · 부가 0원</small>
                    </div>
                    <div class="gcost-stat-item">
                        <span class="gcost-stat-label">이번 달 지출 (전체)</span>
                        <strong id="gcost_stat_month" class="gcost-stat-value">0원</strong>
                        <small id="gcost_stat_month_sub" class="gcost-stat-sub">메인 0원 · 부가 0원</small>
                    </div>
                </div>
                <div id="gcost_drawer_wallet_bar" class="gcost-drawer-wallet-bar" style="display:none;"></div>
                <div class="gcost-stats-actions">
                    <button type="button" id="gcost_calc_now_btn" class="gcost-btn gcost-btn-primary gcost-btn-xs">채팅 계산</button>
                    <button type="button" id="gcost_open_live_btn" class="gcost-btn gcost-btn-xs">전체 내역</button>
                    <button type="button" id="gcost_export_btn" class="gcost-btn gcost-btn-xs">백업</button>
                    <button type="button" id="gcost_import_btn" class="gcost-btn gcost-btn-xs">복원</button>
                    <button type="button" id="gcost_reset_today" class="gcost-btn gcost-btn-xs">오늘 초기화</button>
                    <button type="button" id="gcost_reset_all" class="gcost-btn gcost-btn-xs">전체 초기화</button>
                </div>
            </div>

            <div class="gcost-row">
                <label class="checkbox_label">
                    <input id="gcost_enabled" type="checkbox" />
                    <span>비용 계산 및 말풍선 배지 표시 활성화</span>
                </label>
            </div>

            <div class="gcost-row">
                <label class="checkbox_label">
                    <input id="gcost_intercept_fetch" type="checkbox" />
                    <span>네트워크 자동 추적 (독립 확장·외부 API·요약·번역 자동 감지)</span>
                </label>
            </div>

            <div class="gcost-row">
                <label class="checkbox_label">
                    <input id="gcost_auto_model_pricing" type="checkbox" />
                    <span>호출된 모델명 자동 인식해 모델별 단가 적용</span>
                </label>
            </div>

            <div class="gcost-row">
                <label for="gcost_preset">기본 단가 프리셋 (자동 인식 실패 시 폴백)</label>
                <select id="gcost_preset" class="text_pole">
                    <option value="gemini-4-carbon-promo">Gemini 4 Carbon / Argon (~11/30 프로모션가)</option>
                    <option value="gemini-4-carbon-std">Gemini 4 Carbon / Argon (12/1~ 정상가)</option>
                    <option value="gemini-4-hydrogen">Gemini 4 Hydrogen</option>
                    <option value="gemini-4-neon">Gemini 4 Neon</option>
                    <option value="gemini-3.8-flash">Gemini 3.8 Flash (~12/31)</option>
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite</option>
                    <option value="gemini-3.1-pro">Gemini 3.1 Pro Preview (200k 구간)</option>
                    <option value="custom">직접 입력 (Custom)</option>
                </select>
            </div>

            <hr />
            <div class="gcost-section-title">기본 구간 단가 (1M 토큰당 USD)</div>
            <div class="gcost-grid">
                <div>
                    <label for="gcost_in_base">일반 입력 ($)</label>
                    <input id="gcost_in_base" type="number" step="0.01" class="text_pole" />
                </div>
                <div>
                    <label for="gcost_cache_base">캐시 입력 ($)</label>
                    <input id="gcost_cache_base" type="number" step="0.001" class="text_pole" />
                </div>
                <div>
                    <label for="gcost_out_base">출력/생각 ($)</label>
                    <input id="gcost_out_base" type="number" step="0.01" class="text_pole" />
                </div>
            </div>

            <div class="gcost-section-title">고용량 구간 단가 (임계값 초과 시, 1M당 USD)</div>
            <div class="gcost-row">
                <label for="gcost_tier_threshold">구간 전환 임계값 (토큰)</label>
                <input id="gcost_tier_threshold" type="number" step="1000" class="text_pole" />
            </div>
            <div class="gcost-grid">
                <div>
                    <label for="gcost_in_high">일반 입력 ($)</label>
                    <input id="gcost_in_high" type="number" step="0.01" class="text_pole" />
                </div>
                <div>
                    <label for="gcost_cache_high">캐시 입력 ($)</label>
                    <input id="gcost_cache_high" type="number" step="0.001" class="text_pole" />
                </div>
                <div>
                    <label for="gcost_out_high">출력/생각 ($)</label>
                    <input id="gcost_out_high" type="number" step="0.01" class="text_pole" />
                </div>
            </div>

            <hr />
            <div class="gcost-section-title">프롬프트 캐싱 · 즉시 계산 · 환율</div>
            <div class="gcost-row">
                <label class="checkbox_label">
                    <input id="gcost_auto_cache" type="checkbox" />
                    <span>API 실측 메타데이터(usage) 우선 사용</span>
                </label>
            </div>
            <div class="gcost-row">
                <label for="gcost_cache_rate">추정 모드 캐시 적중률: <span id="gcost_cache_rate_val">80</span>%</label>
                <input id="gcost_cache_rate" type="range" min="0" max="99" step="1" />
            </div>
            <div class="gcost-row">
                <label class="checkbox_label">
                    <input id="gcost_auto_base_prompt" type="checkbox" />
                    <span>고정 프롬프트 자동 측정 (현재 캐릭터·프리셋·페르소나 / 실측 역산)</span>
                </label>
            </div>
            <div class="gcost-row">
                <label for="gcost_base_prompt_tokens">고정 프롬프트 추정치 (시스템/캐릭터/로어북)</label>
                <input id="gcost_base_prompt_tokens" type="number" step="500" class="text_pole" />
            </div>
            <div class="gcost-row">
                <label for="gcost_exchange_rate">원화(KRW) 환율 (1 USD 기준)</label>
                <input id="gcost_exchange_rate" type="number" step="10" class="text_pole" />
            </div>
            <div class="gcost-grid" style="grid-template-columns: 1fr 1fr;">
                <div>
                    <label for="gcost_daily_budget">일일 예산 (원 · 0=끔)</label>
                    <input id="gcost_daily_budget" type="number" step="1000" min="0" class="text_pole" />
                </div>
                <div>
                    <label for="gcost_monthly_budget">월간 예산 (원 · 0=끔)</label>
                    <input id="gcost_monthly_budget" type="number" step="5000" min="0" class="text_pole" />
                </div>
            </div>
            <div class="gcost-row">
                <label for="gcost_display_mode">표시 형식</label>
                <select id="gcost_display_mode" class="text_pole">
                    <option value="both">원화 + 달러 병기 (약 18원 / $0.0128)</option>
                    <option value="krw">원화만 표시 (약 18원)</option>
                    <option value="usd">달러만 표시 ($0.0128)</option>
                </select>
            </div>
        </div>
    </div>
</div>
